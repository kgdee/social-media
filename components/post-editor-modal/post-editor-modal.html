<div class="post-editor-modal modal hidden" onclick="PostEditorModal.close()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="PostEditorModal.close()">
      <i class="bi bi-x-lg"></i>
    </button>
    <div class="modal-title">Create post</div>

    <div class="modal-body">
      <div class="profile-display">
        <div class="avatar self-avatar"></div>
        <span class="self-username">Username</span>
      </div>

      <textarea class="content-input" placeholder="What's on your mind?"></textarea>

      <div class="image-preview hidden">
        <img src="/assets/images/post-image.png">
        <div class="actions">
          <button class="circle-btn"><i class="bi bi-pencil"></i></button>
          <button class="circle-btn" onclick="PostEditorModal.clearImage()"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>

      <div class="optional-input-group">
        <span>Add to your post</span>
        <label class="image-input">
          <i class="bi bi-image"></i>
          <input type="file" accept="image/*" hidden />
        </label>
      </div>
    </div>

    <div class="modal-actions">
      <button class="button" onclick="PostEditorModal.createPost()">Post</button>
    </div>
  </div>
</div>
