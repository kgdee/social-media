<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link href="../vendor/bootstrap-icons-1.13.1/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/home.css" />
    <link rel="stylesheet" href="../components/comments-section/comments-section.css" />
    <link rel="stylesheet" href="../components/create-post-modal/create-post-modal.css" />
    <link rel="stylesheet" href="../components/navbar/navbar.css" />
    <link rel="stylesheet" href="../components/post-card/post-card.css" />
    <link rel="stylesheet" href="../components/post-modal/post-modal.css" />
    <link rel="stylesheet" href="../components/profile-modal/profile-modal.css" />
    <link rel="stylesheet" href="../components/toast/toast.css" />
    <script src="../vendor/firebasejs-10.10.0/firebase-app-compat.js" defer></script>
    <script src="../vendor/firebasejs-10.10.0/firebase-auth-compat.js" defer></script>
    <script src="../vendor/firebasejs-10.10.0/firebase-firestore-compat.js" defer></script>
    <script src="../js/constants.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/firebase.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../components/toast/toast.js" defer></script>
    <script src="../components/navbar/navbar.js" defer></script>
    <script src="../components/create-post-modal/create-post-modal.js" defer></script>
    <script src="../components/post-card/post-card.js" defer></script>
    <script src="../components/post-modal/post-modal.js" defer></script>
    <script src="../components/comments-section/comments-section.js" defer></script>
    <script src="../components/profile-modal/profile-modal.js" defer></script>
    <script src="../js/home.js" defer></script>
  </head>
  <body>
    <div class="app home-page">
      <div class="navbar"></div>

      <main class="feed-container container">
        <div class="create-post-widget feed-card" onclick="CreatePostModal.toggle()">
          <div class="avatar self-avatar"></div>
          <input class="content-input" type="text" placeholder="What's on your mind?" onfocus="this.blur()" />
          <label class="image-input">
            <i class="bi bi-image"></i>
          </label>
        </div>

        <div class="create-story-widget feed-card" onclick="handleUnavailable()">
          <div class="add-btn">
            <i class="bi bi-plus-lg"></i>
          </div>
          <div class="info">
            <div class="title">Create story</div>
            <p class="subtitle">Share a photo or video or write something</p>
          </div>
        </div>

        <div class="people-widget feed-card">
          <button class="menu-btn"><i class="bi bi-three-dots"></i></button>
          <div class="title"><i class="bi bi-people"></i>People you may know</div>

          <div class="item-list"></div>

          <button class="expand-btn" onclick="handleUnavailable()">See all</button>
        </div>

        <div class="post-list">
          <div class="message center">Loading posts...</div>
        </div>
      </main>

      <div class="profile-modal"></div>
      <div class="post-modal"></div>
      <div class="create-post-modal"></div>
      <div class="toast"></div>
    </div>
  </body>
</html>
