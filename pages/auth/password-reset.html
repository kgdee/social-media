<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect - Social Media</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/vendor/bootstrap-icons-1.13.1/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="/components/loading-overlay/loading-overlay.css" />
    <script src="/vendor/firebasejs-10.10.0/firebase-app-compat.js" defer></script>
    <script src="/vendor/firebasejs-10.10.0/firebase-auth-compat.js" defer></script>
    <script src="/vendor/firebasejs-10.10.0/firebase-firestore-compat.js" defer></script>
    <script src="/config.js" defer></script>
    <script src="/js/constants.js" defer></script>
    <script src="/js/utils.js" defer></script>
    <script src="/js/firebase.js" defer></script>
    <script src="/js/main.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="/components/loading-overlay/loading-overlay.js" defer></script>
  </head>
  <body>
    <div class="app container auth-page password-reset">
      <img src="/assets/images/logo.png" class="logo" onclick="changePage()" />

      <div class="auth-section">
        <div class="auth-wrapper">
          <h2 class="title">Reset your password</h2>
          <p class="subtitle">Enter your user account's verified email address and we will send you a password reset link.</p>

          <form class="auth-form" onsubmit="sendPasswordResetEmail(event)">
            <input class="email-input" type="text" placeholder="Enter your email address" required />
            <button type="submit" class="button">Send password reset email</button>
          </form>

          <div class="acc-link" onclick="changePage('login')">Remember password? <span>Log in</span></div>
        </div>

        <div class="credit-display">
          <img src="/assets/images/meta.png" class="meta-icon" />
          Meta
        </div>
      </div>

      <div class="toast"></div>
      <div class="loading-overlay"></div>
    </div>
  </body>
</html>
